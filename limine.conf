# ThemeliOS Limine Bootloader Configuration (v8 format)
#
# This file tells the Limine bootloader how to load and start the ThemeliOS
# kernel. Limine reads this file from the boot media (ISO/disk) at startup.
#
# Format: key: value (lowercase, colon-space separated)
# Entries: /Entry Name (forward-slash prefix)
# URIs: resource():/path (boot() = partition containing this config file)
#
# Documentation: https://github.com/limine-bootloader/limine/blob/v8.x/CONFIG.md

# Boot immediately without showing a menu.
# Set to a positive number (seconds) to show a menu with a countdown.
timeout: 0

# Boot entry for ThemeliOS.
# The forward-slash prefix (/) defines a named boot entry.
/ThemeliOS
    # Use the Limine boot protocol (as opposed to linux or multiboot2).
    protocol: limine

    # Path to the kernel ELF binary on the boot media.
    # boot() refers to the partition where this limine.conf was found.
    kernel_path: boot():/boot/themelios
