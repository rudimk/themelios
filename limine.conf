# ThemeliOS Limine Bootloader Configuration (v10)
#
# This file tells the Limine bootloader how to load and start the ThemeliOS
# kernel. Limine reads this file from the boot media (ISO/disk) at startup.
#
# Format: key: value (lowercase, colon-space separated)
# Entries: /Entry Name (forward-slash prefix)
# URIs: resource():/path (boot() = partition containing this config file)
#
# Documentation: https://github.com/limine-bootloader/limine/blob/v10.x/CONFIG.md
#
# The pinned bootloader version lives in `xtask`'s `LIMINE_BRANCH`, not here; keep the
# link above in step with it. The `.conf` format is unchanged from v8 to v10.

# Boot immediately without showing a menu.
# Set to a positive number (seconds) to show a menu with a countdown.
timeout: 0

# Print what the bootloader is doing, on the way to handing over.
#
# Deliberate, and the reason is diagnostic rather than cosmetic. A boot that fails *before*
# the kernel runs has, until now, produced nothing at all from ThemeliOS — at best the
# firmware's own exception handler naming an address in its own memory, which says nothing
# about what was being attempted. That is precisely the failure mode reported on UTM, where
# the console shows `Synchronous Exception at 0x…` and not one line above it identifies a
# stage. Limine's verbose output is the only thing that speaks in that window.
#
# The cost is a handful of extra lines on every boot, before the kernel banner. The smokes
# match on markers rather than on whole-output equality, so it does not affect them. Turn
# it off if the shipped image ever needs a quiet console; keep it while the aarch64 port is
# still meeting firmware it has not met before.
verbose: yes

# Boot entry for ThemeliOS.
# The forward-slash prefix (/) defines a named boot entry.
/ThemeliOS
    # Use the Limine boot protocol (as opposed to linux or multiboot2).
    protocol: limine

    # Path to the kernel ELF binary on the boot media.
    # boot() refers to the partition where this limine.conf was found.
    kernel_path: boot():/boot/themelios
