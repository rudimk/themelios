[package]
name = "themelios"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rudi MK"]
description = "ThemeliOS — an experimental capability-based microkernel"

[dependencies]
# Limine boot protocol crate — provides the data structures and request types
# that the Limine bootloader uses to communicate with the kernel at boot time.
limine = "0.5"

# Spinlock-based synchronization primitives for no_std environments.
# Used inside our InterruptMutex wrapper for the global serial writer
# and (later) the kernel heap allocator.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

# Profile settings (panic = "abort") are in the workspace root Cargo.toml
# because Cargo requires profiles to be defined at the workspace level.
