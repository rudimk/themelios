[package]
name = "themelios"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rudi MK"]
description = "ThemeliOS — an experimental capability-based microkernel"

[features]
# When enabled, the kernel runs automated tests instead of the interactive shell.
# Used by `cargo xtask test`, which builds with --features test and boots QEMU
# with the isa-debug-exit device for programmatic exit code reporting.
test = []

[dependencies]
# Limine boot protocol crate — provides the data structures and request types
# that the Limine bootloader uses to communicate with the kernel at boot time.
limine = "0.5"

# Spinlock-based synchronization primitives for no_std environments.
# Used inside our InterruptMutex wrapper for the global serial writer
# and (later) the kernel heap allocator.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

# Linked-list-based heap allocator for no_std environments.
# We use the non-locked `Heap` variant (default-features = false disables the
# built-in spinlock wrapper) and wrap it in our own InterruptMutex to prevent
# deadlocks when timer interrupts fire during allocation.
linked_list_allocator = { version = "0.10", default-features = false }

# Profile settings (panic = "abort") are in the workspace root Cargo.toml
# because Cargo requires profiles to be defined at the workspace level.
