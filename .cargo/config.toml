# Workspace-level Cargo configuration for ThemeliOS.
#
# NOTE: We intentionally do NOT set a default build target here because
# the workspace contains both the kernel (bare-metal target) and xtask
# (host target). The xtask handles passing --target to kernel builds.
#
# Architecture-specific rustflags are applied by xtask via RUSTFLAGS
# environment variable or cargo arguments.

[alias]
# `cargo xtask build` is equivalent to `cargo run --package xtask -- build`
xtask = "run --package xtask --"
# Shorthand: `cargo xt build`
xt = "run --package xtask --"

# Linker script for the x86_64 bare-metal kernel.
# This tells the linker to use our custom memory layout, which places the
# kernel in the higher half of the virtual address space (0xffffffff80000000)
# as required by the Limine boot protocol.
[target.x86_64-unknown-none]
rustflags = ["-Crelocation-model=static", "-Clink-arg=-Tkernel/linker-x86_64.ld"]

# Linker script for the aarch64 bare-metal kernel (Phase 7). Same higher-half base
# as x86_64; the Limine protocol is architecture-neutral.
#
# The **softfloat** variant is deliberate. The hardfloat target enables +neon, and the
# compiler then lowers ordinary work — struct moves, `memset`, and notably every
# `core::fmt` path behind `println!` — to SIMD. Kernel code therefore holds live
# vector-register state at arbitrary points, while the exception entry stub saves only
# x0-x30. Any handler that touches FP on a path that *returns* would silently corrupt
# the interrupted context, with no fault. Softfloat removes the hazard by construction
# rather than by convention, at the cost of no FP in the kernel — the same trade Linux
# makes. FP/SIMD *is* enabled in early boot as of Phase 8.4e — userspace needs it and
# CPACR_EL1.FPEN cannot permit EL0 while trapping EL1 — but the kernel itself still emits
# no vector instructions, which is what keeps it from clobbering a task's FPSIMD state.
[target.aarch64-unknown-none-softfloat]
rustflags = ["-Crelocation-model=static", "-Clink-arg=-Tkernel/linker-aarch64.ld"]

# There is deliberately **no** `[target.aarch64-unknown-none]` section, and that is a
# decision rather than an omission.
#
# `aarch64-unknown-none` is the *servers'* target — the hardfloat sibling of the kernel's
# softfloat one, chosen because ring-3 code has no reason to forgo SIMD and `libthemelios`'
# consumers benefit from it. The mapping lives in `xtask`'s `server_target`, not here.
#
# Phase 8.5's plan called for adding a section for it. Measuring first showed that would be
# worse than doing nothing:
#
#   * `xtask` builds the servers with `RUSTFLAGS` set in the environment, and env
#     `RUSTFLAGS` *replaces* `target.*.rustflags` wholesale rather than appending. Any flags
#     written here would be silently discarded on every build the project actually performs.
#   * They would not be discarded for a direct `cargo build --target aarch64-unknown-none`,
#     which is the one case they would reach — and there they would apply the **kernel's**
#     linker script to a server. That is not hypothetical: it is exactly what the
#     `x86_64-unknown-none` section above does today, and why a direct
#     `cargo build -p squashfs-server --target x86_64-unknown-none` fails with
#     "cannot find linker script kernel/linker-x86_64.ld" while the same build through
#     `cargo xtask build` succeeds.
#
# So the entry would be inert where it is read and harmful where it is not. Servers are
# built through `xtask`; that is where their flags belong.

