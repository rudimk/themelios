# Workspace-level Cargo configuration for ThemeliOS.
#
# NOTE: We intentionally do NOT set a default build target here because
# the workspace contains both the kernel (bare-metal target) and xtask
# (host target). The xtask handles passing --target to kernel builds.
#
# Architecture-specific rustflags are applied by xtask via RUSTFLAGS
# environment variable or cargo arguments.

[alias]
# `cargo xtask build` is equivalent to `cargo run --package xtask -- build`
xtask = "run --package xtask --"
# Shorthand: `cargo xt build`
xt = "run --package xtask --"

# Linker script for the x86_64 bare-metal kernel.
# This tells the linker to use our custom memory layout, which places the
# kernel in the higher half of the virtual address space (0xffffffff80000000)
# as required by the Limine boot protocol.
[target.x86_64-unknown-none]
rustflags = ["-Crelocation-model=static", "-Clink-arg=-Tkernel/linker-x86_64.ld"]
