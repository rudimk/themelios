# Single CI workflow for ThemeliOS:
# - On pull requests: run kernel tests only.
# - On push to main: run kernel tests, build the release ISOs, and publish
#   them as a GitHub Release tagged with the build ULID.
#
# The ULID (Universally Unique Lexicographically Sortable Identifier) is
# produced by kernel/build.rs and written to target/build-ulid so the
# release job can read it without parsing build output.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: amd64 — build + test suite (QEMU q35)
    runs-on: ubuntu-latest
    # The in-QEMU suite budget is 180s (raised from 90s). The job cap has to sit
    # above it with room for the build, or a slow-but-passing run gets killed by
    # GitHub before the harness can time out and dump the serial log — turning a
    # diagnosable failure into a bare "job cancelled".
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-limine-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-limine-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso squashfs-tools e2fsprogs

      # The amd64 server blobs must not change while Phase 8 ports userspace to
      # aarch64. Every `#[cfg]` added to `libthemelios` and to the six `_start`
      # routines is supposed to be inert on x86; if one is not, the symptom is a
      # behavioural change in ring 3 that no test necessarily names. This rebuilds
      # all thirteen and compares them against the committed manifest.
      #
      # Runs before the suite because it is the cheaper signal: it needs no QEMU,
      # and a blob that moved unexpectedly is worth knowing about before spending
      # fifteen minutes finding out which test it broke.
      #
      # An intended change regenerates the manifest:
      #     cargo xtask verify-servers --arch amd64 --update
      # and the resulting diff is committed deliberately.
      - name: Verify server blobs against the committed hash manifest
        run: cargo xtask verify-servers --arch amd64

      - name: Run kernel tests
        run: cargo xtask test --arch amd64

  arm64:
    name: aarch64 — build + boot + test suite (QEMU virt)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Three levels of aarch64 coverage, cheapest first:
    #
    #  1. The compile gate (`arm64-gate`) builds smoltcp alone — with the net
    #     server's exact feature set — for aarch64-unknown-none. It goes red the
    #     moment the TCP/IP stack takes an amd64-only or std dependency, long
    #     before the port would trip over it.
    #  2. The boot smoke (`arm64-smoke`) builds the kernel itself for aarch64 and
    #     boots it headless on QEMU `virt` under UEFI, asserting it reaches the
    #     boot banner on the PL011 UART. That proves the whole
    #     Limine → EL1 → UART path runs, not merely that the kernel compiles.
    #  3. The ISO smoke (`arm64-iso-smoke`) boots the *shipped artifact* —
    #     target/themelios-arm64.iso — rather than the directory-backed UEFI ESP
    #     that step 2 uses. Step 2 proves the kernel boots; only this proves the
    #     UEFI-only El Torito layout we publish is itself bootable. Without it the
    #     release job would ship an arm64 ISO nothing has ever booted.
    #
    # The smokes need qemu-system-aarch64 plus the AAVMF firmware pair; on Ubuntu
    # the qemu-efi-aarch64 package ships them under /usr/share/AAVMF, which is the
    # first path xtask's find_aavmf() probes. xorriso is needed because step 3
    # builds an ISO.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64-

      - name: Install aarch64 QEMU + UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 xorriso

      - name: Compile-gate smoltcp + kernel for aarch64
        run: cargo xtask arm64-gate
      # Live as of 8.5c: this hashes eight real blobs — the seven flat servers and
      # elf-smoke — against xtask/servers-arm64.sha256.
      #
      # It was added in 8.5a while aarch64 had no userspace servers at all, when it
      # succeeded by doing nothing. That was deliberate: the alternative was "add the
      # arm64 step once the servers build", which is the kind of deferral that does not
      # get made. Instead the command was written to succeed with nothing to verify on
      # an unported architecture, so this step would start checking by itself the moment
      # one gained servers.
      #
      # That is what happened, two sub-phases later, with no edit to this file. The
      # branch that made it a no-op is gone from xtask — both targets build servers now,
      # so it could no longer run.
      - name: Verify server blobs against the committed hash manifest
        run: cargo xtask verify-servers --arch arm64

      - name: Boot the aarch64 kernel on QEMU virt (banner smoke)
        run: cargo xtask arm64-smoke

      - name: Boot the aarch64 ISO on QEMU virt (banner smoke)
        run: cargo xtask arm64-iso-smoke

      - name: Run the kernel test suite on QEMU virt
        run: cargo xtask test --arch arm64

  release:
    name: Release ISOs (amd64 + aarch64)
    # Both arches gate the release: an amd64 ISO is only worth publishing if the
    # suite passed, and an arm64 ISO is only worth publishing if something has
    # actually booted that image.
    needs: [test, arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-limine-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-limine-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso squashfs-tools e2fsprogs

      - name: Build release ISO (amd64)
        run: cargo xtask iso --arch amd64

      - name: Build release ISO (aarch64)
        run: cargo xtask iso --arch arm64

      - name: Extract build ULID
        id: ulid
        run: |
          ULID=$(cat target/build-ulid)
          echo "ulid=$ULID" >> "$GITHUB_OUTPUT"
          echo "Build ULID: $ULID"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ulid.outputs.ulid }}
          name: "ThemeliOS Build ${{ steps.ulid.outputs.ulid }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            Build ULID: `${{ steps.ulid.outputs.ulid }}`

            | ISO | Architecture | Firmware |
            |-----|--------------|----------|
            | `themelios-amd64.iso` | x86_64 | Hybrid BIOS + UEFI |
            | `themelios-arm64.iso` | aarch64 | UEFI only |

            The images are not interchangeable. The amd64 ISO carries both a BIOS
            El Torito entry and an EFI one, so it boots on legacy BIOS and UEFI
            alike. The arm64 ISO is UEFI-only — QEMU `virt` and arm64 platforms
            generally have no BIOS, so there is no BIOS scaffolding to add.
          files: |
            target/themelios-amd64.iso
            target/themelios-arm64.iso
