# Single CI workflow for ThemeliOS:
# - On pull requests: run kernel tests only.
# - On push to main: run kernel tests, build the release ISO, and publish
#   it as a GitHub Release tagged with the build ULID.
#
# The ULID (Universally Unique Lexicographically Sortable Identifier) is
# produced by kernel/build.rs and written to target/build-ulid so the
# release job can read it without parsing build output.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-limine-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-limine-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso squashfs-tools e2fsprogs

      - name: Run kernel tests
        run: cargo xtask test
        
  arm64-gate:
    name: aarch64 smoltcp compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Phase 4 runs and tests only on amd64, but the TCP/IP stack (smoltcp) is
    # meant to be architecture-independent so the Phase 7 arm64 port inherits it
    # unchanged. This job compiles smoltcp alone — with the net server's exact
    # feature set — for aarch64-unknown-none (see servers/smoltcp-gate). It goes
    # red the moment the stack takes an amd64-only or std dependency, long before
    # the arm64 port would trip over it. Compile-only: no QEMU needed.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-arm64gate-${{ hashFiles('servers/smoltcp-gate/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-arm64gate-

      - name: Compile smoltcp for aarch64-unknown-none
        run: cargo xtask arm64-gate

  release:
    name: Release ISO (amd64)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-limine-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-limine-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso squashfs-tools e2fsprogs

      - name: Build release ISO
        run: cargo xtask iso

      - name: Extract build ULID
        id: ulid
        run: |
          ULID=$(cat target/build-ulid)
          echo "ulid=$ULID" >> "$GITHUB_OUTPUT"
          echo "Build ULID: $ULID"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ulid.outputs.ulid }}
          name: "ThemeliOS Build ${{ steps.ulid.outputs.ulid }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            Build ULID: `${{ steps.ulid.outputs.ulid }}`
          files: target/themelios.iso
