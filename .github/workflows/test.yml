name: Kernel Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # rust-toolchain.toml in the repo pins the nightly version.
        # The action reads it automatically.
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - name: Cache cargo registry and Limine
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/limine
          key: ${{ runner.os }}-cargo-limine-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-limine-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso

      - name: Run kernel tests
        run: cargo xtask test
